# Smithery configuration for DataCrazy
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_datacrazy

name: datacrazy-mcp
displayName: "DataCrazy"
description: >
  CRM omnichannel DataCrazy (WhatsApp, Instagram, Facebook) via API oficial: leads, negócios, pipelines e estágios, atividades, tags, produtos, conversas e atendimento, listas, anexos e comentários. Gere sua chave de API no painel em Configurações → Chaves de API.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/datacrazy-mcp
repository: https://github.com/mcp-dir/datacrazy-mcp

tags:
  - datacrazy
  - brazil
  - sales
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_datacrazy

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_datacrazy/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
